name: CI

# The gates of AGENTS.md with the NSH release the crate depends on (NSH_VERSION). Actions are pinned by commit.

on:
  push:
    branches: [master, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The NSH release the crates depend on (Cargo.toml, examples/*/native).
  NSH_VERSION: 0.7.1

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK 4 and what Skia links
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libclang-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libzstd-dev libssl-dev libasound2-dev \
            libgl-dev libegl-dev libgles-dev libwayland-dev libx11-dev libfontconfig1-dev libfreetype-dev fonts-dejavu
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            examples/headless/native
            examples/parity/native
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: echo "NSH_HOME=$RUNNER_TEMP/nsh-home" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nsh-cli/bin
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_VERSION }}
      - name: Install the CLI of NSH_VERSION
        run: |
          root="$RUNNER_TEMP/nsh-cli"
          if [ ! -x "$root/bin/nsh" ]; then
            cargo install --locked nsh-cli --version "$NSH_VERSION" --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
      - run: nsh --version
      - run: cd examples/headless && nsh check && nsh test
      - run: cd examples/parity && nsh check && nsh test
